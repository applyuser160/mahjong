[package]
name = "mahjong"
version = "0.1.0"
edition = "2021"

[lib]
name = "mahjong"
crate-type = ["cdylib", "rlib"]

[dependencies]
arrayvec = "0.7"
pyo3 = "0.25.0"
rand = { version = "0.8", features = ["small_rng"] }
rayon = "1.10"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "python_api_benchmark"
harness = false

[[bench]]
name = "mahjong_benchmark"
harness = false

[[bench]]
name = "simd_benchmark"
harness = false

[profile.release]
lto = "fat"           # クロスクレートのインライン化・デッドコード除去を有効化
codegen-units = 1     # 単一コード生成ユニットで最大最適化（コンパイル時間増加とトレード）
opt-level = 3         # 最大最適化レベル（明示指定）
strip = true          # デバッグシンボルの除去（バイナリサイズ削減）

[profile.bench]
lto = "fat"
codegen-units = 1
opt-level = 3
